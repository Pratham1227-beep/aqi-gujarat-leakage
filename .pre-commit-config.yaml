repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        additional_dependencies: [numpy, pandas, pyarrow, scikit-learn, xgboost, statsmodels, torch, pydantic, pyyaml]
        pass_filenames: false
        args: [src]